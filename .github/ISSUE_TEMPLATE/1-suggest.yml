name: ✨ Suggest a indicator, scheme or official source
description: Add something useful to India-Development-Dashboard
title: "[Suggest] "
labels: ["suggestion"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make this better! Suggestions are reviewed by the maintainer before anything is added.
  - type: input
    id: name
    attributes:
      label: What should be added?
      placeholder: Name of the indicator, scheme or official source
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Official link
      placeholder: https://
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
      description: One or two lines for other readers.
    validations:
      required: true
